<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="128" fill="#0B0F17"/>
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="#10B981" stroke-width="8" opacity="0.4"/>
  <defs>
    <linearGradient id="azmk-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background subtle glow -->
  <circle cx="256" cy="256" r="160" fill="#10B981" opacity="0.12" filter="url(#glow)"/>
  
  <!-- Dumbbell Left Plate -->
  <rect x="90" y="180" width="36" height="152" rx="16" fill="url(#azmk-grad)"/>
  <rect x="134" y="206" width="24" height="100" rx="10" fill="url(#azmk-grad)"/>
  
  <!-- Dumbbell Right Plate -->
  <rect x="386" y="180" width="36" height="152" rx="16" fill="url(#azmk-grad)"/>
  <rect x="354" y="206" width="24" height="100" rx="10" fill="url(#azmk-grad)"/>
  
  <!-- Center Bar -->
  <rect x="158" y="244" width="196" height="24" rx="12" fill="#E2E8F0"/>
  
  <!-- Central AZMK Lightning Bolt Symbol -->
  <polygon points="274,130 200,266 254,266 238,382 312,246 258,246" fill="#10B981" stroke="#0B0F17" stroke-width="12" stroke-linejoin="round" filter="url(#glow)"/>
</svg>
